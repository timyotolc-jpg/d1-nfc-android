name: Build APKs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APKs
        run: gradle --no-daemon :wallet:assembleDebug :pos:assembleDebug

      - name: Rename APKs
        run: |
          mkdir -p out
          cp wallet/build/outputs/apk/debug/wallet-debug.apk out/d1-wallet.apk
          cp pos/build/outputs/apk/debug/pos-debug.apk out/d1-pos.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk

      - name: Publish "latest" release with the APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: D1 NFC demo — latest build
          body: "APKs de la última compilación: d1-wallet.apk (teléfono = tarjeta, HCE) y d1-pos.apk (lector/POS)."
          files: out/*.apk
          prerelease: false
          make_latest: true
