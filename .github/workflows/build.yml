name: Build APKs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEY: ${{ secrets.UPLOAD_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 platforms;android-35 platforms;android-36 build-tools;34.0.0 build-tools;35.0.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APKs
        run: gradle --no-daemon --console=plain :wallet:assembleDebug :pos:assembleDebug :app:assembleDebug 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      # si falla, el final del log queda en un issue (los logs de Actions no siempre son accesibles desde afuera)
      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -n "e: \|error:\|What went wrong\|FAILED\|Unresolved\|Execution failed" build.log | head -60; echo '...'; tail -60 build.log; echo '```'; } > body.md
          gh issue create --title "Build failed: ${GITHUB_SHA::7}" --body-file body.md || true

      - name: Rename APKs
        run: |
          mkdir -p out
          cp wallet/build/outputs/apk/debug/wallet-debug.apk out/d1-wallet.apk
          cp pos/build/outputs/apk/debug/pos-debug.apk out/d1-pos.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/d1-showcase.apk
          ls -la out

      # Google Play (prueba interna): bundle .aab firmado con la upload key. Secreto UPLOAD_KEY = "password:base64(release.jks)".
      - name: Upload key
        if: env.UPLOAD_KEY != ''
        run: |
          echo "${UPLOAD_KEY#*:}" | base64 -d > wallet/release.jks
          echo "KEYSTORE_PASSWORD=${UPLOAD_KEY%%:*}" >> "$GITHUB_ENV"
      # Los APKs publicados con el nombre principal (d1-pos.apk, d1-wallet.apk, d1-showcase.apk) van firmados con la upload key:
      # firma estable → cada versión se instala encima de la anterior sin desinstalar y sin perder la configuración.
      - name: Build signed bundles + release APKs (wallet + app + pos)
        if: env.UPLOAD_KEY != ''
        run: |
          gradle --no-daemon :wallet:bundleRelease :wallet:assembleRelease :app:bundleRelease :app:assembleRelease :pos:assembleRelease
          cp wallet/build/outputs/bundle/release/wallet-release.aab out/d1-wallet.aab
          cp wallet/build/outputs/apk/release/wallet-release.apk out/d1-wallet.apk
          cp wallet/build/outputs/apk/release/wallet-release.apk out/d1-wallet-release.apk
          cp app/build/outputs/bundle/release/app-release.aab out/d1-showcase.aab
          cp app/build/outputs/apk/release/app-release.apk out/d1-showcase.apk
          cp app/build/outputs/apk/release/app-release.apk out/d1-showcase-release.apk
          cp pos/build/outputs/apk/release/pos-release.apk out/d1-pos.apk
          rm -f wallet/release.jks
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            out/*.apk
            out/*.aab

      - name: Publish "latest" release with the APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: D1 NFC demo — latest build
          body: "Última compilación: d1-showcase.apk / d1-showcase.aab (la demo como app, con el motor NFC adentro), d1-wallet.apk / d1-wallet.aab (motor NFC invisible) y d1-pos.apk (lector/POS)."
          files: |
            out/*.apk
            out/*.aab
          prerelease: false
          make_latest: true
